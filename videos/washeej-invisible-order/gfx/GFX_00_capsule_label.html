<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
/* Holographic label riding on the order capsule (alpha, 900x300). Track/pin it to the capsule in
   S00 (cold-open glimpse, ~8 frames), S03C (capsule emerges) and S04 (capsule at the barrier). */
#tag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:26px;
 padding:30px 52px;border-radius:80px;background:linear-gradient(180deg,rgba(255,250,244,.20),rgba(255,250,244,.06));
 border:2px solid rgba(255,240,228,.55);box-shadow:0 0 40px rgba(254,215,184,.35),inset 0 0 30px rgba(254,215,184,.15);
 color:#fff7ef;font-size:84px;font-weight:600;white-space:nowrap;text-shadow:0 0 24px rgba(254,215,184,.8)}
.c{width:84px;height:84px;border-radius:50%;border:4px solid #fff7ef;display:grid;place-items:center}
#sh{position:absolute;inset:0;border-radius:80px;overflow:hidden}
#sh i{position:absolute;top:-20%;bottom:-20%;width:90px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg)}
</style></head><body>
<div id="tag"><div class="c"><svg width="50" height="50" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#fff7ef" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>تم الإرسال<div id="sh"><i id="shi"></i></div></div>
<script src="anim.js"></script>
<script>
window.seek=t=>{const i=eo(prog(t,0,.18));$('#tag').style.opacity=i*(0.92+0.08*Math.sin(t*40));
 $('#tag').style.transform=`translate(-50%,-50%) scale(${lerp(.9,1,i)})`;
 $('#shi').style.left=lerp(-150,820,prog(t,.15,.9))+'px';};
</script></body></html>
