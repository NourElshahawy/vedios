<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
/* Scene 04 typographic beat — alpha overlay, 1080x1920, composited over the frozen capsule at the barrier.
   Lands in the silence after «بس الطلب ما وصلكش». Hard cut in, no bounce: weight comes from stillness. */
.l{position:absolute;left:0;right:0;text-align:center;color:#f6efe6;font-weight:600;letter-spacing:-1px}
#a{top:1130px;font-size:110px}
#ne{top:1250px;font-size:170px;font-weight:300;color:#fed7b8;font-family:"Cormorant Garamond",serif}
#b{top:1450px;font-size:110px;color:rgba(246,239,230,.42)}
#strike{position:absolute;top:1528px;height:6px;background:#c23a3f;left:50%;transform:translateX(-50%);border-radius:3px}
</style></head><body>
<div class="l" id="a">تم الإرسال</div><div class="l" id="ne">≠</div><div class="l" id="b">تم الاستلام</div><div id="strike"></div>
<script src="anim.js"></script>
<script>
// cue 0.00 hard-in «تم الإرسال» · 0.45 «≠» · 0.80 «تم الاستلام» (dim) · 1.30 red line breaks it · out 3.4–3.8
window.seek=t=>{
 const out=1-prog(t,3.4,3.8);
 const a=prog(t,0,0.06); $('#a').style.opacity=a*out; $('#a').style.filter=`blur(${(1-a)*8}px)`;
 const n=eo(prog(t,0.45,0.75)); $('#ne').style.opacity=n*out; $('#ne').style.transform=`scale(${lerp(1.25,1,n)})`;
 const b=eo(prog(t,0.8,1.2)); $('#b').style.opacity=b*out; $('#b').style.transform=`translateY(${(1-b)*24}px)`;
 const s=expo(prog(t,1.3,1.55)); $('#strike').style.width=(560*s)+'px'; $('#strike').style.opacity=out;
};
</script></body></html>
